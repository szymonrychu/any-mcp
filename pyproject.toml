[project]
name = "any-mcp"
version = "0.3.0"
description = "Expose any API, or groups of APIs, as MCP tools through plugins"
readme = "README.md"
license = "MIT"
authors = [{ name = "Szymon Rychu", email = "szymon.rychu@gmail.com" }]
keywords = ["mcp", "plugins", "api", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "pydantic>=2",
    "jsonschema>=4.23",
    "pyyaml",
    "httpx",
]

[project.scripts]
any-mcp = "any_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/szymonrychu/any-mcp"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
