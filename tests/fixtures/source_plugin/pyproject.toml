[project]
name = "any-mcp-source-plugin"
version = "0.1.0"
description = "Fixture plugin package installed from a plugin source by the any-mcp tests"
requires-python = ">=3.12"

[project.entry-points."any_mcp.plugins"]
source_plugin = "source_plugin:SourcePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/source_plugin"]
