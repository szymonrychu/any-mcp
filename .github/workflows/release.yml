name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Tag must equal v plus the pyproject version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version v${version}" >&2
            exit 1
          fi
      - run: mise run install
      - run: mise run lint
      - run: mise run test
      - name: Build the wheel and smoke-test it in a clean venv
        run: |
          uv build --wheel --out-dir dist
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/any-mcp" --version
          "$RUNNER_TEMP/wheel-venv/bin/any-mcp" --help
      - name: Install from the git tag into another clean venv and smoke-test it
        run: |
          uv venv "$RUNNER_TEMP/git-venv"
          uv pip install --python "$RUNNER_TEMP/git-venv" "any-mcp @ git+https://github.com/${{ github.repository }}@${{ github.ref_name }}"
          "$RUNNER_TEMP/git-venv/bin/any-mcp" --version
          "$RUNNER_TEMP/git-venv/bin/any-mcp" --help
      - name: Extract the changelog section of the tag
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
